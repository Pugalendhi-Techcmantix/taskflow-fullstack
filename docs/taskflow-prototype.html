<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Project Management Prototype</title>
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#f2f4f9;--border:#e3e6ef;--text:#1b1f2a;--muted:#6b7280;--faint:#9aa1ad;
  --accent:#4f46e5;--accent-hover:#4338ca;--accent-soft:#eef0ff;--accent-text:#3730a3;
  --green:#16a34a;--green-soft:#e7f7ed;--red:#dc2626;--red-soft:#fdecec;--amber:#c26d06;--amber-soft:#fdf3e1;
  --blue:#2563eb;--blue-soft:#e8f0fe;--gray-soft:#eef0f4;--purple:#7c3aed;--purple-soft:#f1ebfe;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);--shadow-lg:0 16px 40px rgba(16,24,40,.18);
}
[data-theme=dark]{
  --bg:#0f1117;--surface:#171a22;--surface-2:#1e222c;--border:#2a2f3b;--text:#e7e9ee;--muted:#9aa1ad;--faint:#6b7280;
  --accent:#818cf8;--accent-hover:#a5b4fc;--accent-soft:#23264a;--accent-text:#c7cbff;
  --green-soft:#12301e;--red-soft:#3a1717;--amber-soft:#3a2a10;--blue-soft:#162544;--gray-soft:#262a35;--purple-soft:#2a1f45;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:none}
input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
h4{font-size:13px;font-weight:600;margin:18px 0 8px}
.muted{color:var(--muted)}.sub{color:var(--muted);margin-top:2px}
.spacer{flex:1}

/* inputs & buttons */
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 14px;font-weight:500;border:1px solid var(--border);background:var(--surface);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.err{color:var(--red);font-size:12px;margin-top:4px;min-height:0}
.row{display:flex;gap:12px}.row>*{flex:1}

/* badges */
.badge-p{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-Critical{background:var(--red-soft);color:var(--red)}
.p-High{background:var(--amber-soft);color:var(--amber)}
.p-Medium{background:var(--blue-soft);color:var(--blue)}
.p-Low{background:var(--gray-soft);color:var(--muted)}
.s-todo{background:var(--gray-soft);color:var(--muted)}
.s-inprogress{background:var(--blue-soft);color:var(--blue)}
.s-review{background:var(--purple-soft);color:var(--purple)}
.s-done{background:var(--green-soft);color:var(--green)}
.chip-active{background:var(--green-soft);color:var(--green)}
.chip-planned{background:var(--blue-soft);color:var(--blue)}
.chip-completed{background:var(--gray-soft);color:var(--muted)}
.type{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.type-Story{background:#16a34a}.type-Bug{background:#dc2626}.type-Task{background:#2563eb}
.avatar{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;flex:none;letter-spacing:.02em}
.avatar.empty{background:var(--gray-soft);color:var(--faint);border:1px dashed var(--faint)}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--gray-soft);color:var(--muted);font-weight:500}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-main{display:grid;place-items:center;padding:32px}
.auth-card{width:100%;max-width:380px}
.auth-side{background:linear-gradient(150deg,#312e81,#4f46e5 60%,#6366f1);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}
.auth-side h2{font-size:28px;line-height:1.25;margin-bottom:12px;font-weight:600}
.auth-side p{opacity:.85;margin-bottom:28px;max-width:420px}
.mod-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px}
.mod-list div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 12px;font-size:13px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tabs{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;margin:22px 0 20px}
.tabs button{flex:1;padding:7px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}

/* shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.proj-switch label{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;text-decoration:none}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text)}
.nav-sec{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:12px 10px 4px}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 10px}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.search-wrap{position:relative;flex:1;max-width:480px}
.search-wrap svg.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-wrap input{padding-left:34px;background:var(--surface-2);border-color:transparent}
.search-pop{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;display:none;max-height:420px;overflow:auto}
.search-pop.open{display:block}
.sr-sec{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;padding:8px 10px 4px}
.sr-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.sr-item:hover{background:var(--surface-2)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.pop-anchor{position:relative}
.nbadge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.nbadge.pulse{animation:pulse .8s ease 2}
@keyframes pulse{50%{transform:scale(1.35)}}
.dropdown{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);width:300px;display:none;z-index:30}
.dropdown.open{display:block}
.notif-dd{width:380px}
.dd-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.dd-head button{color:var(--accent);font-size:12px;font-weight:600}
.notif{display:flex;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.notif:last-child{border-bottom:none}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:var(--accent-soft)}
.notif .t{font-size:13px}.notif .time{font-size:11px;color:var(--faint);margin-top:2px}
.dd-body{max-height:380px;overflow:auto}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 14px;width:100%;text-align:left}
.menu-item:hover{background:var(--surface-2)}
.avatar-btn{border-radius:50%;padding:2px}
.avatar-btn:hover{box-shadow:0 0 0 3px var(--accent-soft)}
.role-banner{background:var(--amber-soft);color:var(--amber);font-size:13px;padding:8px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.role-banner button{text-decoration:underline;font-weight:600;color:inherit}
main{padding:24px;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* cards & dashboard */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat .label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.stat .value{font-size:28px;font-weight:650;margin-top:4px;letter-spacing:-.02em}
.stat .delta{font-size:12px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.grid-2.even{grid-template-columns:1fr 1fr}
.bar-row{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:5px}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.list-row:last-child{border-bottom:none}
.list-row .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{font-size:12px;color:var(--muted);font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.act{display:flex;gap:10px;padding:9px 0;font-size:13px}
.act .time{font-size:11px;color:var(--faint)}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* board */
.filters{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filters .input{width:auto;min-width:150px}
.filters .search{min-width:220px}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-height:420px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-size:13px}
.col-head .count{background:var(--surface);border-radius:999px;padding:0 8px;font-size:12px;color:var(--muted);font-weight:600}
.col-head .pts{margin-left:auto;font-size:12px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%}
.dot.todo{background:#9aa1ad}.dot.inprogress{background:var(--blue)}.dot.review{background:var(--purple)}.dot.done{background:var(--green)}
.col-body{flex:1;display:flex;flex-direction:column;gap:8px;border-radius:9px;padding:2px;transition:background .15s;min-height:80px}
.col-body.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.col-body:not(:has(.kcard))::after{content:"Drop tasks here";color:var(--faint);font-size:12px;text-align:center;padding:24px 0;border:1px dashed var(--border);border-radius:9px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
.kcard:hover{box-shadow:0 4px 12px rgba(16,24,40,.1);border-color:var(--accent)}
.kcard.locked{cursor:pointer}
.kcard.dragging{opacity:.45;transform:rotate(1.5deg)}
.kcard.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:var(--shadow)}}
.kc-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.kc-top .badge-p{margin-left:auto}
.kc-title{font-weight:500;font-size:13.5px;margin-bottom:10px;line-height:1.4}
.kc-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meta{display:inline-flex;align-items:center;gap:3px}
.overdue{color:var(--red);font-weight:600}
.add-card{margin-top:8px;padding:8px;border-radius:8px;color:var(--muted);text-align:left;font-weight:500}
.add-card:hover{background:var(--surface);color:var(--text)}
.note{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}

/* table */
.table-card{padding:0;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--text)}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;color:var(--muted)}
.pager .pages{display:flex;gap:4px}
.pager button{min-width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--surface)}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.empty-row{text-align:center;color:var(--muted);padding:40px}

/* sprints & projects */
.sprint{margin-bottom:14px}
.sprint-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin:12px 0 8px}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:5px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj{cursor:pointer;transition:border-color .15s,transform .15s}
.proj:hover{border-color:var(--accent);transform:translateY(-2px)}
.proj-key{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.stack{display:flex}.stack .avatar{border:2px solid var(--surface);margin-left:-8px}.stack .avatar:first-child{margin-left:0}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state h3{color:var(--text);margin-bottom:6px}

/* permissions */
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.matrix input:disabled{cursor:not-allowed}
.perm-code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--faint)}

/* activity */
.timeline{position:relative;padding-left:8px}
.tl-day{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 6px}
.tl-day:first-child{margin-top:0}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.tl-task{background:var(--blue-soft);color:var(--blue)}.tl-sprint{background:var(--green-soft);color:var(--green)}.tl-project{background:var(--purple-soft);color:var(--purple)}.tl-comment{background:var(--amber-soft);color:var(--amber)}.tl-user{background:var(--gray-soft);color:var(--muted)}
.link{color:var(--accent);cursor:pointer;font-weight:600}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(15,17,23,.5);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;animation:pop .18s ease}
.modal.lg{max-width:900px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
.task-grid{display:grid;grid-template-columns:1fr 260px}
.task-main{padding:20px;border-right:1px solid var(--border);min-width:0}
.task-side{padding:20px;background:var(--surface-2)}
.title-input{font-size:20px;font-weight:600;border:1px solid transparent;border-radius:8px;padding:4px 8px;margin-left:-8px;width:calc(100% + 8px);background:transparent;outline:none}
.title-input:hover:not(:disabled){border-color:var(--border)}
.title-input:focus{border-color:var(--accent);background:var(--surface)}
.comment{display:flex;gap:10px;margin-bottom:12px}
.comment .bubble{background:var(--surface-2);border-radius:10px;padding:8px 12px;flex:1}
.comment .who{font-size:12px;font-weight:600}.comment .who span{color:var(--faint);font-weight:400;margin-left:6px}
.hist{font-size:12.5px;color:var(--muted);padding:5px 0;display:flex;gap:8px}

/* toasts */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#1b1f2a;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;align-items:center;gap:10px;max-width:380px;animation:slide .25s ease}
.toast.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3);flex:none}
.toast.error{background:var(--red)}
[data-theme=dark] .toast{background:#2a2f3b;border:1px solid #3d4352}
[data-theme=dark] .btn.primary,[data-theme=dark] .pager button.active{color:#11131a}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.mobile-only{display:none}

/* optimistic saving + rollback */
.kcard.saving{opacity:.7;border-style:dashed;cursor:progress}
.kcard.saving .kc-title::after{content:" · saving…";color:var(--faint);font-weight:400;font-size:12px}
.kcard.reverted{animation:shake .45s ease;border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.kcard:focus-visible,.nav-item:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,.avatar-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* loading + error states */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.error-state{text-align:center;padding:56px 20px}
.error-state .ic-wrap{width:46px;height:46px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin:0 auto 12px}
.api-banner{background:var(--red-soft);color:var(--red)}
.role-banner .ic,.toast .ic{flex:none}
/* keyboard shortcuts */

.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}

.sc-row>span:last-child{display:flex;gap:4px;flex:none}

.subtask{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.subtask input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
.subtask.done span{text-decoration:line-through;color:var(--faint)}
.subtask .icon-btn{width:26px;height:26px;margin-left:auto;flex:none}
.save-ind{font-size:12px;color:var(--faint);font-weight:400;margin-left:8px}
.backdrop.still,.backdrop.still .modal{animation:none}
/* collapsible sidebar (desktop) */
.collapse-btn .ic{transition:transform .2s}
@media (min-width:861px){
  .shell.collapsed .sidebar{width:68px;padding:18px 10px}

  .shell.collapsed .collapse-btn .ic{transform:rotate(180deg)}
}
@media (max-width:860px){.collapse-btn{display:none!important}.sc-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2.even{grid-template-columns:1fr}}
@media (max-width:860px){

  main{padding:16px}.topbar{padding:0 12px}
  #topCreate span{display:none}
}

const kv=s=>({get:k=>{try{return window[s].getItem(k)}catch(e){return null}},set:(k,v)=>{try{v?window[s].setItem(k,v):window[s].removeItem(k)}catch(e){}}});

function apiCall(kind){ // kind: 'GET' | 'MUTATE'
  const m=state.apiMode,fail=m==='down'||(m==='flaky'&&kind==='MUTATE'&&Math.random()<.3);
  return new Promise((res,rej)=>setTimeout(()=>fail?rej(new Error('500 Internal Server Error')):res(),kind==='GET'?380:650));
}
function setApiMode(m){
  state.apiMode=API_MODES[m]?m:'off';closeDDs();renderChrome();
  toast(state.apiMode==='off'?'Server simulation is back to normal':`Server simulation: <b>${esc(API_MODES[state.apiMode])}</b>`,state.apiMode==='off'?'':'error');

/* ---------- URL state: filters, sort and page live in the URL (shareable, survive refresh) ---------- */
const DEFAULTS={
  board:{q:'',assignee:'',priority:'',type:''},
  tasks:{q:'',status:'',priority:'',assignee:'',type:'',sprint:'',sort:'key',dir:1,page:1,size:8},
  activity:{user:'',type:''},
};
const SORT_KEYS=['key','title','status','priority','assignee','sprint','points','due'],PAGE_SIZES=[5,8,15,25],ACT_TYPES=['task','sprint','project','comment','user'];
function readURL(){
  const raw=location.hash.replace(/^#\/?/,''),[r,qs]=raw.split('?'),p=new URLSearchParams(qs||'');
  // validate every value at the boundary (the real app does this with Zod); invalid values fall back to defaults
  const g=(k,ok)=>{const v=p.get(k);return v!=null&&ok(v)?v:''};
  const isUser=v=>v==='none'||state.users.some(u=>u.id===v);
  const pid=g('project',v=>state.projects.some(x=>x.id===v));if(pid)state.projectId=pid;
  state.route=ROUTES[r]?r:'dashboard';
  if(state.route==='board')state.board={q:(p.get('q')||'').slice(0,100),assignee:g('assignee',isUser),priority:g('priority',v=>PRIORITIES.includes(v)),type:g('type',v=>TYPES.includes(v))};
  if(state.route==='tasks')state.table={q:(p.get('q')||'').slice(0,100),status:g('status',v=>STATUS_ORDER.includes(v)),priority:g('priority',v=>PRIORITIES.includes(v)),
    type:g('type',v=>TYPES.includes(v)),assignee:g('assignee',isUser),sprint:g('sprint',v=>v==='backlog'||state.sprints.some(s=>s.id===v&&s.projectId===state.projectId)),
    sort:g('sort',v=>SORT_KEYS.includes(v))||'key',dir:p.get('dir')==='desc'?-1:1,page:Math.max(1,parseInt(p.get('page'),10)||1),size:PAGE_SIZES.includes(+p.get('size'))?+p.get('size'):8};
  if(state.route==='activity')state.actFilter={user:g('user',v=>state.users.some(u=>u.id===v)),type:g('type',v=>ACT_TYPES.includes(v))};
}
function urlFor(route){
  const p=new URLSearchParams({project:state.projectId});
  const add=(obj,def)=>Object.entries(obj).forEach(([k,v])=>{if(k==='dir'){if(v===-1)p.set('dir','desc')}else if(v!==''&&v!==def[k])p.set(k,v)});
  if(route==='board')add(state.board,DEFAULTS.board);
  if(route==='tasks')add(state.table,DEFAULTS.tasks);
  if(route==='activity')add(state.actFilter,DEFAULTS.activity);
  return '#/'+route+'?'+p.toString();
}
function writeURL(){if(!state.authed)return;const u=urlFor(state.route);if(location.hash!==u)history.replaceState(null,'',u)}
function copyLink(){
  const u=location.href,done=()=>toast('Link copied. Anyone who opens it sees these exact filters.');
  try{navigator.clipboard.writeText(u).then(done,()=>window.prompt('Copy this link',u))}catch(e){window.prompt('Copy this link',u)}
}

const stat=(l,v,ic,d)=>`<div class="card stat"><div class="label">${I(ic,15)} ${l}</div><div class="value">${v}</div><div class="delta">${d}</div></div>`;
function burndown(sp){
  const ts=state.tasks.filter(t=>t.sprintId===sp.id),total=sum(ts,t=>t.points)||1,doneP=sum(ts.filter(t=>t.status==='done'),t=>t.points);
  const days=Math.max(1,Math.round((sp.end-sp.start)/DAY)),el=Math.max(0,Math.min(days,Math.round((T0-sp.start)/DAY)));
  const rem=total-doneP,actual=[];
  for(let i=0;i<=el;i++){const f=el?i/el:0;actual.push(Math.round(total-(total-rem)*Math.pow(f,1.35)))}
  const W=600,H=230,pl=34,pr=14,pt=12,pb=28,x=i=>pl+(W-pl-pr)*i/days,y=v=>pt+(H-pt-pb)*(1-v/total);
  let g='';[0,.5,1].forEach(f=>{const v=Math.round(total*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${v}</text>`});
  for(let i=0;i<=days;i+=Math.ceil(days/6))g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--faint)">${fmt(sp.start+i*DAY)}</text>`;
  const pts=actual.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Burndown chart">${g}
    <line x1="${x(0)}" y1="${y(total)}" x2="${x(days)}" y2="${y(0)}" stroke="var(--faint)" stroke-dasharray="5 5" stroke-width="1.5"/>
    <line x1="${x(el)}" x2="${x(el)}" y1="${pt}" y2="${H-pb}" stroke="var(--amber)" stroke-dasharray="2 4"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${actual.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${fmt(sp.start+i*DAY)}: ${v} pts left</title></circle>`).join('')}
  </svg>
  <div class="chart-legend"><span><i style="background:var(--accent)"></i>Remaining points (${rem} of ${total})</span><span><i style="background:var(--faint)"></i>Ideal</span><span><i style="background:var(--amber)"></i>Today</span></div>`;
}

function card(t){

function focusCard(id){const el=document.querySelector(`.kcard[data-id="${id}"]`);if(el)el.focus()}
function cardKey(e,id){
  if(e.target!==e.currentTarget)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openTask(id);return}
  if(e.shiftKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();kbMove(id,e.key==='ArrowRight'?1:-1);return}
  const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(!d)return;e.preventDefault();
  const cols=[...document.querySelectorAll('#board .col-body')].map(b=>[...b.querySelectorAll('.kcard')]);
  let ci=cols.findIndex(c=>c.some(x=>x.dataset.id===id));if(ci<0)return;let ri=cols[ci].findIndex(x=>x.dataset.id===id);
  if(d[0]){let n=ci+d[0];while(cols[n]&&!cols[n].length)n+=d[0];if(!cols[n])return;ci=n;ri=Math.min(ri,cols[n].length-1)}
  else ri=Math.max(0,Math.min(cols[ci].length-1,ri+d[1]));
  cols[ci][ri].focus();
}
function kbMove(id,dir){
  const t=task(id);if(!t||!can('task:move'))return;
  if(t.pending)return toast(`<b>${t.key}</b> is still saving`,'');
  const j=STATUS_ORDER.indexOf(t.status)+dir;if(j<0||j>=STATUS_ORDER.length)return;
  const from=t.status,prevOrder=t.order;t.status=STATUS_ORDER[j];t.order=-1;
  persistMove(id,from,prevOrder,true);
}
/* optimistic update: the card moves at once, the save runs in the background, a failed save puts it back */
function persistMove(id,from,prevOrder,refocus){
  const t=task(id),to=t.status;
  if(to===from){renderColumns();if(refocus)focusCard(id);return}
  t.pending=true;renderColumns();if(refocus)focusCard(id);
  apiCall('MUTATE').then(()=>{
    t.pending=false;log('task',`moved <b>${t.key}</b> from ${STATUS[from]} to ${STATUS[to]}`,t.id);
    safeRenderColumns();if(refocus)focusCard(id);
    toast(`Moved <b>${t.key}</b> to ${STATUS[to]} · team notified in real time`,'live');
  }).catch(err=>{
    if(t.status===to){t.status=from;t.order=prevOrder}t.pending=false;
    safeRenderColumns();const el=document.querySelector(`.kcard[data-id="${id}"]`);if(el)el.classList.add('reverted');if(refocus)focusCard(id);
    toast(`Couldn't move <b>${t.key}</b> to ${STATUS[to]} (${esc(err.message)}). It went back to ${STATUS[from]}.`,'error');
  });
}
function onDragStart(e){
  const el=e.currentTarget,t=task(el.dataset.id);if(!t||t.pending){e.preventDefault();return}
  state.drag={id:t.id,from:t.status,order:t.order};
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.id);
  requestAnimationFrame(()=>el.classList.add('dragging'));
}
function onDragOver(e){
  if(!state.drag)return;e.preventDefault();
  const body=e.currentTarget,el=document.querySelector('.kcard.dragging');if(!el)return;
  const after=[...body.querySelectorAll('.kcard:not(.dragging)')].reduce((best,c)=>{const r=c.getBoundingClientRect(),o=e.clientY-r.top-r.height/2;return o<0&&o>best.o?{o,el:c}:best},{o:-Infinity,el:null}).el;
  if(after)body.insertBefore(el,after);else body.appendChild(el);
  document.querySelectorAll('.col-body').forEach(b=>b.classList.toggle('over',b===body));
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  if(!state.drag)return;const{id,from,order}=state.drag;state.drag=null;
  document.querySelectorAll('.col-body').forEach(b=>{b.classList.remove('over');[...b.querySelectorAll('.kcard')].forEach((c,i)=>{const t=task(c.dataset.id);t.status=b.dataset.status;t.order=i})});
  persistMove(id,from,order,false);
}

function tf(k,v){state.table[k]=v;state.table.page=1;renderTable()}
function setPage(n){state.table.page=n;renderTable()}
const COLS=[['key','Key'],['title','Title'],['status','Status'],['priority','Priority'],['assignee','Assignee'],['sprint','Sprint'],['points','Points'],['due','Due']];
function sortBy(k){const f=state.table;if(f.sort===k)f.dir*=-1;else{f.sort=k;f.dir=1}renderTable()}
function renderTable(){
  const f=state.table,q=f.q.toLowerCase();
  let rows=projTasks().filter(t=>(!q||t.title.toLowerCase().includes(q)||t.key.toLowerCase().includes(q))&&(!f.status||t.status===f.status)&&(!f.priority||t.priority===f.priority)&&(!f.type||t.type===f.type)
    &&(!f.assignee||(f.assignee==='none'?!t.assignee:t.assignee===f.assignee))&&(!f.sprint||(f.sprint==='backlog'?!t.sprintId:t.sprintId===f.sprint)));
  const val={key:t=>+t.key.split('-')[1],title:t=>t.title.toLowerCase(),status:t=>STATUS_ORDER.indexOf(t.status),priority:t=>PRIORITIES.indexOf(t.priority),assignee:t=>t.assignee?user(t.assignee).name:'~',sprint:t=>sprintName(t.sprintId),points:t=>t.points,due:t=>t.due||'9999'}[f.sort];
  rows.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*f.dir});
  const total=rows.length,pages=Math.max(1,Math.ceil(total/f.size));if(f.page>pages)f.page=pages;
  const s=(f.page-1)*f.size,pageRows=rows.slice(s,s+f.size);
  $('thead').innerHTML='<tr>'+COLS.map(([k,l])=>`<th class="sortable" onclick="sortBy('${k}')">${l} ${f.sort===k?(f.dir>0?'↑':'↓'):''}</th>`).join('')+'</tr>';
  $('tbody').innerHTML=pageRows.length?pageRows.map(t=>`<tr class="click" onclick="openTask('${t.id}')">
    <td><span style="display:inline-flex;gap:6px;align-items:center">${typeI(t.type)}<span class="key">${t.key}</span></span></td>
    <td style="font-weight:500;max-width:340px">${esc(t.title)}</td><td>${statusB(t.status)}</td><td>${prio(t.priority)}</td>
    <td><span style="display:inline-flex;gap:8px;align-items:center;white-space:nowrap">${avatar(t.assignee,22)}${t.assignee?esc(user(t.assignee).name):'<span class="muted">Unassigned</span>'}</span></td>
    <td class="muted" style="white-space:nowrap">${esc(sprintName(t.sprintId))}</td><td>${t.points}</td><td style="white-space:nowrap">${dueLabel(t)||'<span class="muted">—</span>'}</td></tr>`).join('')
    :`<tr><td colspan="8" class="empty-row">No tasks match these filters.</td></tr>`;
  $('pager').innerHTML=`<span>Showing ${total?s+1:0}–${Math.min(s+f.size,total)} of ${total}</span>
    <span style="display:flex;gap:10px;align-items:center"><select class="input" aria-label="Rows per page" style="width:auto;padding:5px 26px 5px 8px" onchange="tf('size',+this.value)">${PAGE_SIZES.map(n=>opt(n,n+' / page',f.size)).join('')}</select>
    <span class="pages"><button aria-label="Previous page" ${f.page<=1?'disabled':''} onclick="setPage(${f.page-1})">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${f.page===i+1?'active':''}" ${f.page===i+1?'aria-current="page"':''} onclick="setPage(${i+1})">${i+1}</button>`).join('')}<button aria-label="Next page" ${f.page>=pages?'disabled':''} onclick="setPage(${f.page+1})">›</button></span></span>`;
  writeURL();
}

/* description autosave: debounced, shows Saving… / Saved, rolls back on failure */
let descTimer=null;
function descInput(id,el){
  if(!can('task:update'))return;const ind=$('descSave');if(ind)ind.textContent='Saving…';
  clearTimeout(descTimer);

    const t=task(id);if(!t)return;const old=t.desc;t.desc=el.value;
    apiCall('MUTATE').then(()=>{
      if(state.descLoggedFor!==id){log('task',`updated the description of <b>${t.key}</b>`,t.id);state.descLoggedFor=id}
      const i=$('descSave');if(i)i.textContent='Saved just now';
    }).catch(err=>{t.desc=old;const i=$('descSave');if(i)i.innerHTML=`<span style="color:var(--red)">Not saved (${esc(err.message)}). Keep typing to retry.</span>`});

function addSub(id){

function toggleSub(id,sid){
  const t=task(id),s=t.subtasks.find(x=>x.id===sid);if(!s)return;s.done=!s.done;
  if(s.done)log('task',`completed subtask "${esc(s.title)}" on <b>${t.key}</b>`,t.id);rerenderTask(id);
}
function removeSub(id,sid){const t=task(id),s=t.subtasks.find(x=>x.id===sid);t.subtasks=t.subtasks.filter(x=>x.id!==sid);if(s)log('task',`removed subtask "${esc(s.title)}" from <b>${t.key}</b>`,t.id);rerenderTask(id)}
const FIELD={title:'title',desc:'description',status:'status',priority:'priority',assignee:'assignee',type:'type',sprintId:'sprint',points:'story points',due:'due date'};
function show(f,v){if(f==='status')return STATUS[v];if(f==='assignee')return v?user(v).name:'Unassigned';if(f==='sprintId')return sprintName(v);if(f==='due')return v?fmt(new Date(v+'T00:00')):'none';return v}
/* optimistic field edit: UI changes now, save runs in background, failure reverts with a clear message */
function updateTask(id,f,v){
  const t=task(id);if(!t||!can('task:update'))return;
  if(f==='title'){v=v.trim();if(v.length<3){toast('Title must be at least 3 characters','error');return openTask(id)}}
  if(['assignee','sprintId','due'].includes(f))v=v||null;if(f==='points')v=+v;
  const old=t[f],oldOrder=t.order;if(old===v)return;
  t[f]=v;if(f==='status')t.order=-1;
  rerenderTask(id);
  apiCall('MUTATE').then(()=>{
    if(f==='title')log('task',`renamed <b>${t.key}</b> to "${esc(v)}"`,t.id);
    else log('task',`changed ${FIELD[f]} of <b>${t.key}</b> from ${esc(show(f,old))} to ${esc(show(f,v))}`,t.id);
    if(f==='assignee'&&v&&v!==me().id)toast(`${esc(user(v).name)} will get a notification`,'live');
    if(state.openTaskId===id)openTask(id);
  }).catch(err=>{
    if(t[f]===v){t[f]=old;t.order=oldOrder}
    rerenderTask(id);
    toast(`Couldn't save ${FIELD[f]} of <b>${t.key}</b> (${esc(err.message)}). It went back to "${esc(show(f,old))}".`,'error');
  });
}

function viewActivity(){
  const f=state.actFilter;
  const list=state.activity.filter(a=>(!f.user||a.userId===f.user)&&(!f.type||a.type===f.type));
  const groups={};list.forEach(a=>{const d=Math.floor((T0-new Date(a.time).setHours(0,0,0,0))/DAY);const k=d<=0?'Today':d===1?'Yesterday':fmt(a.time);(groups[k]=groups[k]||[]).push(a)});
  const icon={task:'list',sprint:'sprint',project:'folder',comment:'msg',user:'users'};
  return`<div class="page-head"><div><h1>Activity history</h1><p class="sub">An audit trail of every change in the workspace, written by the event bus</p></div></div>
  <div class="filters">
    <select class="input" aria-label="Person" onchange="af('user',this.value)">${opt('','Everyone',f.user)}${state.users.map(u=>opt(u.id,u.name,f.user)).join('')}</select>
    <select class="input" aria-label="Event type" onchange="af('type',this.value)">${opt('','All event types',f.type)}${Object.keys(icon).map(k=>opt(k,k[0].toUpperCase()+k.slice(1)+' events',f.type)).join('')}</select>
    <span class="muted" style="font-size:13px">${list.length} events</span>
  </div>
  <div class="card"><div class="timeline">${Object.entries(groups).map(([d,items])=>`<div class="tl-day">${d}</div>`+items.map(a=>`<div class="tl-item"><span class="tl-icon tl-${a.type}">${I(icon[a.type],14)}</span>
    <div style="flex:1"><div><b>${esc(user(a.userId).name)}</b> ${a.text} ${a.taskId&&task(a.taskId)?`<span class="link" style="font-size:12px;margin-left:4px" onclick="openTask('${a.taskId}')">Open</span>`:''}</div>
    <div class="muted" style="font-size:12px">${ago(a.time)} · ${new Date(a.time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div></div>${avatar(a.userId,26)}</div>`).join('')).join('')||'<div class="empty-state">No activity matches these filters.</div>'}</div></div>`;
}

function af(k,v){state.actFilter[k]=v;renderMain();writeURL()}

/* ---------- simulated real-time events (Socket.IO stand-in) ---------- */
function liveTick(){
  if(!state.authed||state.drag||state.view.status!=='success'||state.apiMode==='down')return;
  const sp=activeSprint();if(!sp)return;
  const cand=state.tasks.filter(t=>t.sprintId===sp.id&&t.status!=='done'&&!t.pending);if(!cand.length)return;
  const t=pick(cand),u=pick(state.users.filter(x=>x.id!==me().id&&(x.role==='Developer'||x.role==='Project Manager'))),from=t.status;
  t.status=NEXT[from];t.order=-1;
  log('task',`moved <b>${t.key}</b> from ${STATUS[from]} to ${STATUS[t.status]}`,t.id,u.id);
  notify(`<b>${esc(u.name)}</b> moved <b>${t.key}</b> to ${STATUS[t.status]}`,t.id,u.id);
  toast(`<b>${esc(u.name)}</b> moved ${t.key} → ${STATUS[t.status]}`,'live');
  const busy=$('modal-root').innerHTML||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if(state.route==='board')renderColumns(t.id);
  else if(!busy&&['dashboard','activity','sprints'].includes(state.route))renderMain();
}
setTimeout(()=>{liveTick();setInterval(liveTick,45000)},15000);

/* ---------- boot: restore theme and session, so a refresh keeps you on the same URL ---------- */
applyTheme(local.get('tf-theme'));
(function boot(){
  try{const s=JSON.parse(session.get('tf-session')||'null');if(s&&typeof s.email==='string'&&EMAIL_RE.test(s.email)){me().name=String(s.name||me().name).slice(0,60);me().email=s.email;enterApp(true);return}}catch(e){}
  renderAuth();
})();
</script>
